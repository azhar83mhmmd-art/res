<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Server | Kairoo API</title>
<meta name="description" content="Status kesehatan server Kairoo API secara real-time.">
<link id="favicon" rel="icon" href="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/status/status.css">
</head>
<body data-page="status">

<main class="k-container k-page">
    <div class="k-page-head">
        <div>
            <h1 class="k-h1" style="font-size:28px;">Status Server Realtime</h1>
            <p class="k-lead">Kondisi komponen sistem Kairoo API, diperbarui otomatis.</p>
        </div>
        <div id="live-badge" class="k-badge">
            <span class="k-dot"></span>
            <span id="live-badge-text">Menghubungkan...</span>
        </div>
    </div>

    <div id="overall-banner" class="k-card k-overall-banner">
        <span id="overall-dot" class="k-status-big-dot"></span>
        <div>
            <div id="overall-title" class="k-overall-title">Memeriksa status sistem...</div>
            <div id="overall-sub" class="k-overall-sub">&nbsp;</div>
        </div>
    </div>

    <div id="components-grid" class="k-bento k-components-grid"></div>

    <section class="k-terminal" style="margin-top:24px;">
        <div class="k-terminal-bar">
            <span class="k-terminal-dot"></span><span class="k-terminal-dot"></span><span class="k-terminal-dot"></span>
            <span class="k-terminal-title">healthcheck.log</span>
        </div>
        <div class="k-terminal-body">
            <div class="k-terminal-row"><span class="k-terminal-prompt">$</span><span class="v">kairoo healthcheck --watch</span></div>
            <div id="terminal-log" class="v">Menunggu data...</div>
        </div>
    </section>
</main>

<script src="/kairoo-nav.js"></script>
<script src="/status/status.js"></script>
</body>
</html>
